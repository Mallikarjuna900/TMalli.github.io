<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial; background: #0a0a0a; color: white; }
        .navbar { background: #1a1a1a; padding: 15px 0; border-bottom: 2px solid #00D4AA; position: sticky; top: 0; }
        .nav-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }

        .container { max-width: 1100px; margin: 60px auto; padding: 0 20px; }
        .section { background: #1c1c1c; padding: 40px; border-radius: 15px; margin: 30px 0; border-left: 4px solid #00D4AA; }
        .section h2 { color: #00D4AA; margin-bottom: 20px; font-size: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 25px; }
        .box { background: #252525; padding: 25px; border-radius: 10px; text-align: center; }
        @media (max-width: 768px) { .nav-menu { display: none; } .hero h1 { font-size: 2rem; } }

</head>
